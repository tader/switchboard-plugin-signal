name: Build Signal runtimes
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      upload:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-amd64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .local/downloads
            .local/build-sources/libsignal/libsignal-0.103.0/target
            .local/libsignal
          key: signal-runtime-${{ matrix.platform }}-${{ hashFiles('runtime-pins.json', 'scripts/build-arm64.sh', 'scripts/protoc.sh') }}
      - name: Build Debian-compatible ARM64 Signal library
        if: matrix.platform == 'linux-arm64'
        run: test -f .local/libsignal/libsignal_jni_aarch64.so || bash scripts/build-arm64.sh
      - run: python3 scripts/build-runtime.py --platform "$PLATFORM"
        env:
          PLATFORM: ${{ matrix.platform }}
      - run: npm run test:runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: runner.os == 'Linux'
        with:
          repository: tader/switchboard
          ref: 8a09c51d833ced905290eda600feb6ca93c599f6
          path: switchboard-core
      - name: Verify actual runtime inside Switchboard's Debian image
        if: runner.os == 'Linux'
        run: |
          docker build -t switchboard-signal:verify switchboard-core
          docker run --rm --user node --entrypoint node \
            -v "$PWD:/plugin:ro" -w /plugin \
            -e SIGNAL_PROBE_DIR=/plugin/.local/probe \
            switchboard-signal:verify scripts/runtime-smoke.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.upload
        with:
          name: signal-runtime-${{ matrix.platform }}
          path: .local/release/signal-runtime-${{ matrix.platform }}.tar.gz
          compression-level: 0
          retention-days: 3
